<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 7</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="content">
        <header id="main-header">
            <h1>Assignment 7</h1>
            <h2>Introduction to JavaScript</h2>
        </header>

        <section id="columns">
            <article id="speech-column" class="column">
                <h3>Speech</h3>
                <div id="speech-bubble" class="hidden">
                    Hi!
                </div>
            </article>

            <article id="beverage-column" class="column">
                <h3>Beverage</h3>

                <div class="beverage-row">
                    <label for="beverage-select">Pick your morning beverage:</label>

                    <select id="beverage-select">
                        <option value="">Choose one</option>
                        <option value="Coffee">Coffee</option>
                        <option value="Orange Juice">Orange Juice</option>
                        <option value="Tea">Tea</option>
                        <option value="Water">Water</option>
                    </select>
                </div>

                <p id="beverage-message"></p>
            </article>

            <article id="sticker-column" class="column">
                <h3>Add a Sticker</h3>

                <div id="image-container">
                    <img id="sun-image" src="images/sun.jpg" alt="Cartoon sun">
                    <span id="sticker" class="hidden">😊</span>
                </div>
            </article>
        </section>

        <footer>
            <p>&copy;bradengreen</p>
        </footer>
    </main>

    <script src="index.js"></script>
</body>
</html>
